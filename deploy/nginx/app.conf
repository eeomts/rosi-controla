server {
    listen 80;
    server_name _;

    # a raiz e public/, entao app/, vendor/, database/ e o config.ini ficam
    # fora do alcance do navegador por construcao
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16M;

    access_log /var/log/nginx/controla.access.log;
    error_log /var/log/nginx/controla.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;

        # ARMADILHA: Cubo\Routing\Router monta a rota com SERVER_NAME + REQUEST_URI
        # e corta o CUBO_DIR_NAME (host.wan do config.ini). Com server_name _ o
        # $server_name padrao devolveria literalmente "_" e a rota quebraria.
        # $host so chega certo se o nginx do host mandar proxy_set_header Host $host.
        fastcgi_param SERVER_NAME $host;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
