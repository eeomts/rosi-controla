# Server block do nginx DO HOST (fora do docker). Vai em
# /etc/nginx/sites-available/controla e recebe o certificado pelo certbot.
#
#   sudo ln -s /etc/nginx/sites-available/controla /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d controla.SEU-DOMINIO.com

server {
    listen 80;
    server_name controla.SEU-DOMINIO.com;

    access_log /var/log/nginx/controla.proxy.access.log;
    error_log /var/log/nginx/controla.proxy.error.log;

    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:8001;

        # OBRIGATORIO: sem isto chega Host = 127.0.0.1:8001 no container, o
        # SERVER_NAME nao bate com o host.wan do config.ini e a rota do Cubo quebra
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
