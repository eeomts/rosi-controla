; php.ini do container de producao.
; Erro na tela quem decide e o config.ini (enviroment); aqui e o piso.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 256M
max_execution_time = 60
post_max_size = 16M
upload_max_filesize = 16M

date.timezone = America/Sao_Paulo
default_charset = UTF-8

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; o codigo so muda quando a imagem e reconstruida, entao nao ha o que revalidar
opcache.validate_timestamps = 0

session.cookie_httponly = 1
session.cookie_samesite = Lax
; ligar quando o dominio estiver em https
; session.cookie_secure = 1
