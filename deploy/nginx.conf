# Controla - server block de exemplo. Ajuste server_name, root e o socket do php-fpm.

server {
    listen 80;
    server_name controla.SEU-DOMINIO.com;

    # a raiz e public/, entao app/, vendor/, database/ e config.ini
    # ficam fora do alcance do navegador por construcao
    root /var/www/controla/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16M;

    access_log /var/log/nginx/controla.access.log;
    error_log /var/log/nginx/controla.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        # o Cubo\Routing\Router monta a rota com SERVER_NAME + REQUEST_URI e corta
        # o CUBO_DIR_NAME (vem do host.<location> do config.ini). Usar $host em vez
        # de $server_name evita a rota quebrar quando o server_name nao bate exatamente.
        fastcgi_param SERVER_NAME $host;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
