name: controla

services:

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina no .env}
      MARIADB_DATABASE: ${DB_NAME:-rosi_controla}
      MARIADB_USER: ${DB_USER:?defina no .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?defina no .env}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      # bind mount, NAO volume gerenciado: docker volume prune nao enxerga
      # diretorio do host
      - ./data/mysql:/var/lib/mysql
      # roda uma unica vez, quando ./data/mysql esta vazio
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # as senhas de verdade ficam fora da imagem e fora do git
      - ./deploy/config.ini:/var/www/html/app/Controla/config/config.ini:ro
      - ./data/logs:/var/www/html/app/Controla/logs

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # 127.0.0.1 de proposito: quem alcanca esta porta e o nginx do host,
      # nao a internet
      - "127.0.0.1:${PORTA_LOCAL:-8001}:80"
